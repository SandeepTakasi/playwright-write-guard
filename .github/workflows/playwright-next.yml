name: playwright-next

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  playwright:
    name: playwright ${{ matrix.playwright }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: [latest, next]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm install --no-save @playwright/test@${{ matrix.playwright }} playwright-core@${{ matrix.playwright }}

      - run: npx playwright install --with-deps chromium

      - run: npm test
