name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

  playwright:
    name: playwright (${{ matrix.playwright }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        playwright: ["1.64.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm install --no-save @playwright/test@${{ matrix.playwright }} playwright-core@${{ matrix.playwright }}

      - run: npx playwright install --with-deps chromium

      - run: npm test
